name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Soroban contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The WASM tests load the compiled contract, so build it first.
      - run: cargo build --workspace --release --target wasm32v1-none
      - run: cargo test --workspace

  deployed-artifact:
    name: Deployed WASM reproduces
    runs-on: ubuntu-latest
    env:
      STELLAR_CLI_VERSION: 26.0.0
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - name: Install pinned Stellar CLI
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin stellar
          stellar --version
      - run: stellar contract build --optimize
      - name: Compare with the hash recorded in the Testnet manifest
        run: |
          built=$(sha256sum target/wasm32v1-none/release/agentbatch_poc.wasm | cut -d' ' -f1)
          deployed=$(jq -r .contract.wasmHash deployments/testnet/manifest.json)
          echo "built    $built"
          echo "deployed $deployed"
          test "$built" = "$deployed"

  typescript:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentbatch/voucher build
      - run: pnpm typecheck
      - run: pnpm test
