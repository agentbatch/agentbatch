name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Soroban contract (deployed artifact)
    runs-on: ubuntu-latest
    env:
      STELLAR_CLI_VERSION: 26.0.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install pinned Stellar CLI
        run: |
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin stellar
          stellar --version
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The exact artifact deployed to Testnet; the WASM tests run against it.
      - run: stellar contract build --optimize
      - name: Deployed WASM reproduces from source
        run: |
          built=$(sha256sum target/wasm32v1-none/release/agentbatch_poc.wasm | cut -d' ' -f1)
          deployed=$(jq -r .contract.wasmHash deployments/testnet/manifest.json)
          echo "built    $built"
          echo "deployed $deployed"
          test "$built" = "$deployed"
      - run: cargo test --locked --workspace

  typescript:
    name: Libraries, tools, examples and archived evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:ts
      - run: pnpm evidence:check
      - run: pnpm example:offline
